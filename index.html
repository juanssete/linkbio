<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de presentación</title>
    <link rel="icon" type="image/jpeg" href="juansete.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-energy"></div>

    <div class="main-card">
        <div class="corner-light tl"></div>
        <div class="corner-light tr"></div>

        <header class="profile-section">
            <div class="avatar-container">
                <img src="juansete.jpg" alt="Juansete" class="avatar">
                <div class="energy-ring ring-1"></div>
                <div class="energy-ring ring-2"></div>
            </div>
            <h1 class="neon-text">JUANSETE</h1>
            <span class="badge">CHALLENGER CON ZAC, HIERRO CON LOS DEMÁS CAMPEONES</span>
        </header>

        <div class="video-section">
            <div class="video-container">
                <iframe id="yt-player" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div class="action-links">
            <a href="https://twitch.tv/juanssete" class="btn-animate twitch" target="_blank">
                <div class="laser-shine"></div>
                <i class="fab fa-twitch"></i>
                <span>En Vivo en Twitch</span>
            </a>
            <a href="https://www.instagram.com/juanssete/" class="btn-animate instagram" target="_blank">
                <div class="laser-shine"></div>
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://www.tiktok.com/@juanssete" class="btn-animate tiktok" target="_blank">
                <div class="laser-shine"></div>
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="https://whatsapp.com/channel/0029VbCBeFoKbYMV6CZqwu2y" class="btn-animate whatsapp" target="_blank">
                <div class="laser-shine"></div>
                <i class="fab fa-whatsapp"></i>
                <span>Canal de difusión</span>
            </a>
            <a href="https://www.facebook.com/Juanseteoficial" target="_blank" class="btn-animate facebook">
                <div class="laser-shine"></div>
                <i class="fab fa-facebook"></i>
                <span>FACEBOOK</span>
            </a>
            <a href="https://kick.com/juanssete" target="_blank" class="btn-animate kick">
                <div class="laser-shine"></div>
                <i class="fas fa-gamepad"></i>
                <span>KICK</span>
            </a>
            
            <!-- Botón de Descarga Itero -->
         <a href="https://itero.gg" target="_blank" class="btn-animate itero">
               <div class="laser-shine"></div>
               <svg class="itero-icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <!-- Corona superior -->
               <path fill="currentColor" d="M127 21 L100 47 L117 72 C118 78 112 88 101 92 C88 92 78 76 78 69 L32 51 L65 127 L189 127 L223 50 L178 69 C176 76 166 92 153 92 C142 88 136 78 137 72 L154 47 Z"/>
        <!-- Semicírculo / Sonrisa inferior -->
               <path fill="currentColor" d="M32 149 C45 195 85 223 128 223 C171 223 211 195 224 149 L180 149 C168 174 146 188 128 188 C110 188 88 174 76 149 Z"/>
              </svg>
              <span>DESCARGA ITERO</span>
         </a>
            
            <a href="mailto:juancesete@gmail.com?subject=Contacto" class="btn-animate correo">
                <div class="laser-shine"></div>
                <i class="fas fa-envelope"></i>
                <span>CORREO DE CONTACTO</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
